name: Frontend CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY_FE: ${{ secrets.ECR_REGISTRY_FE }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}  

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        working-directory: ./client
        run: |
          docker build -f Dockerfile.frontend -t ${{env.ECR_REGISTRY_FE}}:latest -t ${{ env.ECR_REGISTRY_FE }}:${{ github.sha }} .
          docker push ${{env.ECR_REGISTRY_FE}}:latest ${{ env.ECR_REGISTRY_FE }}:${{ github.sha }}