name: Frontend CI/CD

on:
    push:
        branches: [main]
    pull_request: 
        branches: [main]

env:
    AWS_REGION: ${{secrets.AWS_REGION}}
    ECR_REGISTRY_FE: ${{secrets.ECR_REGISTRY_FE}}
jobs:
    build-and-push:
        runs-on: ubuntu-latest
        if: github.ref == 'ref/heads/main'

        steps:
            -   name: Check Code
                uses: actions/checkout@v4

            -   name: Configure AWS credentials
                uses: aws/actions/configure-aws-credentials@v4
                with:
                    AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
                    AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
                    AWS_REGION: $AWS_REGION
            
            -   name: Login to ECR
                id: ecr-login
                uses: aws-actions/amazon-ecr-login@v2
            
            -   name: Build push FE image
                working-directory: ./client
                run: |
                    docker build -f Dockerfile.frontend  -t $ECR_REGISTRY_FE:${{github.sha}} .
                    docker push $ECR_REGISTRY_FE:${{github.sha}}
                    



        
    deploy:
        needs: [build-and-push]
        runs-on: self-hosted
        if: github.ref=='ref/heads/main'
        steps:
            -   name: Pull Docker image
                run: |
                    docker pull ${{env.IMAGE_NAME_FE}}:v1.0.0
            
            -   name: Stop and remove old container
                run: |
                    docker stop hmis-kb-fron

