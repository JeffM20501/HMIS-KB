  /api/v1/chat/:
    post:
      operationId: api_v1_chat_create
      description: |-
        POST /api/v1/chat/

        Public (AllowAny) — the chat widget is embedded in both the public
        Help Center and the authenticated Admin/Editor portals (per the PRD's
        embeddability requirement), so this intentionally accepts both
        anonymous and authenticated callers. Role-awareness (FR-5.4 — never
        surface content a user's role wouldn't otherwise see) is handled
        structurally rather than per-request: chatbot/signals.py only ever
        creates embeddings for articles with status='published', so there is
        no draft/pending-review content in the vector index at all for any
        role to leak — retrieval simply has nothing restricted to accidentally
        return.
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/chat/conversations/:
    get:
      operationId: api_v1_chat_conversations_list
      description: |-
        Backs the chat-history requirements: list conversations, load a
        previous conversation's messages, rename, archive, and delete.

        Scoped per-requester in get_queryset (not just via object permission)
        so the list endpoint itself never returns another user's conversations
        — object-level permission alone only protects retrieve/update/delete
        of a specific id you already know, not enumeration via the list view.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
