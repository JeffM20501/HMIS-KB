openapi: 3.0.3
info:
  title: HMIS Knowledge Base API(Taifa Care Help Center)
  version: V1
  description: Complete API for the KB platform and Chatbot widget
paths:
  /api/v1/analytics/audit-logs/:
    get:
      operationId: api_v1_analytics_audit_logs_list
      description: |-
        API endpoint for viewing audit logs.

        PRD FR-3.6: Admin actions are logged with timestamp and user ID.
        Only admins can view audit logs.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogListList'
          description: ''
  /api/v1/analytics/audit-logs/{id}/:
    get:
      operationId: api_v1_analytics_audit_logs_retrieve
      description: |-
        API endpoint for viewing audit logs.

        PRD FR-3.6: Admin actions are logged with timestamp and user ID.
        Only admins can view audit logs.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audit log.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogDetail'
          description: ''
