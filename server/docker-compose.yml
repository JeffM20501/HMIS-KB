services:
  db:
    image: pgvector/pgvector:pg18  
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hmis_kb_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"  # Host:5434 → Container:5432
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hmis_kb_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      # Named volume mounted at the same path the model was pre-baked
      # into at build time (see Dockerfile.backend). Docker populates a
      # new named volume from the image's content at that path on first
      # creation, so this preserves the baked-in model instead of it
      # being silently shadowed (and re-downloaded at runtime) by the
      # `.:/app` bind mount above, which only has your local source tree.
      - fastembed_cache:/app/.fastembed_cache
    restart: unless-stopped
    # Matches the ~512MB Render free-tier constraint being tested.
    # Remove/raise this for normal local development.
    mem_limit: 512m
    memswap_limit: 512m

volumes:
  postgres_data:
  fastembed_cache: